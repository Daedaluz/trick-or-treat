{{- if and (not .Values.database.existingSecret) .Values.database.url }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trick-or-treat.fullname" . }}-db
  labels:
    {{- include "trick-or-treat.labels" . | nindent 4 }}
type: Opaque
stringData:
  uri: {{ .Values.database.url | quote }}
{{- else if not .Values.database.existingSecret }}
{{- fail "set database.url or database.existingSecret" }}
{{- end }}
{{- if and (not .Values.admin.existingSecret) .Values.admin.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trick-or-treat.fullname" . }}-admin
  labels:
    {{- include "trick-or-treat.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.admin.token | quote }}
{{- end }}
