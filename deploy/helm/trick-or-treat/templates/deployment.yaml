apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trick-or-treat.fullname" . }}
  labels:
    {{- include "trick-or-treat.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "trick-or-treat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trick-or-treat.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "trick-or-treat.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: TOT_LISTEN
              value: ":8080"
            - name: TOT_LOG_JSON
              value: {{ .Values.config.logJSON | quote }}
            - name: TOT_TRUST_PROXY
              value: {{ .Values.config.trustProxy | quote }}
            - name: TOT_USER_AGENT
              value: {{ .Values.config.userAgent | quote }}
            - name: TOT_SEASON_SIGNUP_OPENS
              value: {{ .Values.config.season.signupOpens | quote }}
            - name: TOT_SEASON_ARCHIVE_AFTER
              value: {{ .Values.config.season.archiveAfter | quote }}
            - name: TOT_SEASON_TIMEZONE
              value: {{ .Values.config.season.timezone | quote }}
            - name: TOT_SEASON_ARCHIVE_INTERVAL
              value: {{ .Values.config.season.archiveInterval | quote }}
            {{- if or .Values.admin.token .Values.admin.existingSecret }}
            - name: TOT_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.admin.existingSecret | default (printf "%s-admin" (include "trick-or-treat.fullname" .)) }}
                  key: {{ if .Values.admin.existingSecret }}{{ .Values.admin.existingSecretKey }}{{ else }}token{{ end }}
            {{- end }}
            - name: TOT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "trick-or-treat.dbSecretName" . }}
                  key: {{ include "trick-or-treat.dbSecretKey" . }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
