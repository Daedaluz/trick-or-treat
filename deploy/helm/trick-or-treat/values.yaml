replicaCount: 2

image:
  repository: ghcr.io/daedaluz/trick-or-treat
  tag: ""          # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# The GitHub repo is private, so the image in ghcr.io is too.
imagePullSecrets: []
#  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

database:
  # Either give the URL directly (it will be stored in a chart-managed Secret)…
  url: ""
  # …or point at an existing Secret, e.g. one created by CloudNativePG or Zalando's operator.
  existingSecret: ""
  existingSecretKey: "uri"

# Operator-only /api/admin endpoints (e.g. reading feedback). Leave both empty
# to disable them; `kubectl exec ... trick-or-treat feedback list` works regardless.
admin:
  token: ""
  existingSecret: ""
  existingSecretKey: "token"

config:
  # Sent to Nominatim; the usage policy asks for a way to contact the operator.
  userAgent: "trick-or-treat/0.1 (https://github.com/Daedaluz/trick-or-treat)"
  logJSON: true
  trustProxy: true
  season:
    # MM-DD from which households can register a door.
    signupOpens: "10-01"
    # MM-DD of the event itself; the off-season view counts down to it.
    eventDate: "10-31"
    # MM-DD on which the year's doors are moved to the archive and sign-up closes.
    archiveAfter: "11-02"
    # IANA timezone the dates above are evaluated in.
    timezone: "Europe/Stockholm"
    # How often each replica checks whether archiving is due.
    archiveInterval: "1h"

service:
  type: ClusterIP
  port: 80

# Gateway API HTTPRoute. Requires a Gateway in the cluster.
httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: gateway
      namespace: gateway-system
      # sectionName: https
  hostnames:
    - trick-or-treat.example.com

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  create: true
  annotations: {}
  name: ""

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
